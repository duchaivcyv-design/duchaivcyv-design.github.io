<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaoJB Repo</title>
    <style>
        :root {
            --bg-color: #050510;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Nền tối với các quả cầu phát sáng chuyển động */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Các quả cầu phát sáng (Blobs) tạo màu cho kính */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.8;
            animation: float 10s infinite ease-in-out alternate;
        }

        .blob-1 {
            width: 300px;
            height: 300px;
            background: #007aff; /* Xanh Sileo */
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 250px;
            height: 250px;
            background: #ff9500; /* Cam Zebra */
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }

        .blob-3 {
            width: 200px;
            height: 200px;
            background: #af52de; /* Tím */
            top: 40%;
            left: 60%;
            animation-delay: -2s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.2); }
        }

        /* Khung kính chính */
        .liquid-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 36px;
            padding: 40px 24px;
            width: 100%;
            max-width: 400px;
            position: relative;
            /* Đổ bóng và viền sáng kép tạo cảm giác kính dày */
            box-shadow: 
                0 24px 48px rgba(0, 0, 0, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.4),
                inset 0 -1px 1px rgba(255, 255, 255, 0.1);
            z-index: 1;
            overflow: hidden;
        }

        /* Lớp ánh sáng loang trên mặt kính */
        .liquid-glass::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none;
            z-index: -1;
            border-radius: 36px 36px 0 0;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        .subtitle {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 32px;
            text-align: center;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        /* Nút bấm phong cách kính */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 4px 12px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            -webkit-appearance: none;
        }

        /* Hiệu ứng ánh sáng lướt qua nút khi chạm */
        .btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-20deg);
            transition: 0.5s;
        }
        
        .btn:active::after {
            left: 150%;
        }

        .btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.15);
        }

        /* Màu sắc riêng cho từng nút */
        .btn-sileo { 
            background: linear-gradient(135deg, rgba(0, 122, 255, 0.3) 0%, rgba(0, 122, 255, 0.1) 100%); 
            border-color: rgba(0, 122, 255, 0.4); 
        }
        .btn-zebra { 
            background: linear-gradient(135deg, rgba(255, 149, 0, 0.3) 0%, rgba(255, 149, 0, 0.1) 100%); 
            border-color: rgba(255, 149, 0, 0.4); 
        }
        .btn-copy { 
            background: linear-gradient(135deg, rgba(52, 199, 89, 0.3) 0%, rgba(52, 199, 89, 0.1) 100%); 
            border-color: rgba(52, 199, 89, 0.4); 
        }

        /* Danh sách gói */
        .package-list {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }

        .package-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .package-item:last-child { 
            border-bottom: none; 
        }
        
        .package-name { 
            font-weight: 500; 
            font-size: 0.95rem;
        }
        .package-version { 
            color: rgba(255, 255, 255, 0.5); 
            font-size: 0.8rem; 
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Các quả cầu màu phía sau kính -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="liquid-glass">
        <h1>TaoJB Repo</h1>
        <p class="subtitle">Kho tweak cá nhân · Tương thích Sileo & Zebra</p>

        <div class="btn-group">
            <a href="sileo://source/https://duchaivcyv-design.github.io/" class="btn btn-sileo">
                🧊 Thêm vào Sileo
            </a>
            <a href="zbra://sources/add/https://duchaivcyv-design.github.io/" class="btn btn-zebra">
                🦓 Thêm vào Zebra
            </a>
            <button onclick="copyRepoLink()" class="btn btn-copy" id="copyBtn">
                📋 Sao chép URL Repo
            </button>
        </div>

        <div class="package-list">
            <div class="package-item">
                <span class="package-name">27CC Ios 14-18.0</span>
                <span class="package-version">v6.0.2-5</span>
            </div>
            <div class="package-item">
                <span class="package-name">DynaFake 14-18.0</span>
                <span class="package-version">v6.0.2-5</span>
            </div>
            <div class="package-item">
                <span class="package-name">Liquid Tab Ios 14-18.0</span>
                <span class="package-version">v6.0.2-5</span>
            </div>
            <div class="package-item">
                <span class="package-name">26Morph 14-18.0</span>
                <span class="package-version">v6.0.2-5</span>
            </div>
            <div class="package-item">
                <span class="package-name">UnlockCode ios 14-18.0</span>
                <span class="package-version">v6.0.2-5</span>
            </div>
            <div class="package-item">
                <span class="package-name">OpenWave Ios 14-18.0</span>
                <span class="package-version">v6.0.2-5</span>
            </div>
            <div class="package-item">
                <span class="package-name">2712 (trọn bộ) ios 14-18</span>
                <span class="package-version">v6.0.2-5</span>
            </div>
        </div>
    </div>

    <script>
        function copyRepoLink() {
            const url = "https://duchaivcyv-design.github.io/";
            navigator.clipboard.writeText(url).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ Đã sao chép!';
                btn.style.background = 'rgba(52, 199, 89, 0.6)';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                }, 2000);
            }).catch(err => {
                alert("URL Repo: " + url);
            });
        }
    </script>
</body>
</html>
