name: Build Sileo Repo (3 Env Perfect Patcher — rootful/rootless/roothide)
concurrency:
  group: "pages"
  cancel-in-progress: true
on:
  push:
    paths:
      - 'debs/**.deb'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 fakeroot python3 pip python3-pip wget unzip zstd
          pip3 install lief

      - name: Install ldid
        run: |
          wget https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          sudo mv ldid_linux_x86_64 /usr/local/bin/ldid

      - name: Tạo roothide.entitlements chuẩn
        run: |
          cat > roothide.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.no-container</key>
              <true/>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>com.apple.private.amfi.can-execute-cdhash</key>
              <true/>
              <key>com.apple.private.amfi.can-load-cdhash</key>
              <true/>
              <key>get-task-allow</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Process Debs (3 môi trường chuẩn)
        run: |
          cat << 'PYEOF' > patch.py
          import sys, os, subprocess, re
          import lief
          import plistlib

          # ===== BLACKLIST chuẩn (theo ConversionRuleset.json) — KHÔNG patch các đường dẫn hệ thống =====
          # FIX ROOTHIDE #1: đã xóa "/var/jb" khỏi blacklist (trước đây làm mọi đường dẫn /var/jb/... bị bỏ qua, không được chuyển đổi)
          BLACKLIST = [
              "/System", "/usr/lib/libobjc", "/usr/lib/libc++", "/usr/lib/libstdc++", "/usr/lib/dyld",
              "/usr/lib/libMobileGestalt.dylib", "/usr/lib/system", "/usr/lib/swift", "/usr/lib/libswift",
              "/usr/lib/libsql", "/usr/lib/libz",
              "/var/mobile/Library/Preferences/com.apple.", "/var/mobile/Library/Preferences/systemgroup.com.apple.",
              "/var/mobile/Library/Preferences/group.com.apple.", "/var/mobile/Library/Preferences/.GlobalPreferences",
              "/var/mobile/Library/SpringBoard", "/var/mobile/Library/WebClips", "/Library/Wallpaper",
              "/Library/Application Support/AggregateDictionary", "/var/mobile/Library/Caches/com.apple.",
              "/var/checkra1n.dmg", "/private/etc/apt/undecimus", "/Library/Ringtones", "://"
          ]
          def is_blacklisted(p):
              for b in BLACKLIST:
                  if p.startswith(b): return True
              return False

          def strip_varjb(p):
              if p.startswith("/var/jb/"): return p[len("/var/jb"):]
              if p == "/var/jb": return "/"
              return p

          def to_jbroot(p):
              # /var/jb/usr/lib/xxx -> @loader_path/.jbroot/usr/lib/xxx
              if p.startswith("/var/jb/"):
                  return "@loader_path/.jbroot" + p[len("/var/jb"):]
              return p

          def relocate_rootful(temp_dir):
              """BAN ROOTFUL: di chuyen /var/jb/* len goc (rootful KHONG dung /var/jb). Khong tao /rootfs/ (file rootfs giu nguyen)."""
              import shutil
              jb = os.path.join(temp_dir, 'var', 'jb')
              if os.path.isdir(jb):
                  for item in os.listdir(jb):
                      s = os.path.join(jb, item)
                      d = os.path.join(temp_dir, item)
                      if os.path.exists(d):
                          if os.path.isdir(s):
                              for sub in os.listdir(s):
                                  os.makedirs(d, exist_ok=True)
                                  try: os.rename(os.path.join(s, sub), os.path.join(d, sub))
                                  except: pass
                          else:
                              try:
                                  os.remove(d)
                                  os.rename(s, d)
                              except: pass
                      else:
                          try: os.rename(s, d)
                          except: pass
                  shutil.rmtree(jb, ignore_errors=True)
                  var_dir = os.path.join(temp_dir, 'var')
                  if os.path.isdir(var_dir) and not os.listdir(var_dir):
                      try: os.rmdir(var_dir)
                      except: pass

          def _patch_binary_strings(bin_path, env_mode):
              """Ky thuat: thay /var/jb/ (8 bytes) -> //////// (8 bytes) trong strings binary. CHI dung cho rootful.
              FIX ROOTHIDE #2: roothide/rootless KHONG patch strings (////////usr/lib tren roothide tro ve rootfs that, gay crash/safe mode)."""
              if env_mode != 'rootful':
                  return
              try:
                  with open(bin_path, 'rb') as f:
                      data = f.read()
                  new_data = data.replace(b'/var/jb/', b'////////')
                  if new_data != data:
                      with open(bin_path, 'wb') as f:
                          f.write(new_data)
              except Exception:
                  pass

          # FIX ROOTHIDE #4: patch_binary viết lại (lief.MachO.parse hỗ trợ fat, chỉ ghi khi có thay đổi, tạo symlink .jbroot, log lỗi)
          DEP_TYPES = {'LOAD_DYLIB', 'LOAD_WEAK_DYLIB', 'REEXPORT_DYLIB', 'LOAD_REEXPORT_DYLIB', 'LAZY_LOAD_DYLIB'}

          def _ctype(cmd):
              return str(cmd.command).split('.')[-1]

          def _new_rpath(rp):
              try:
                  return lief.MachO.RPathCommand.create(rp)
              except Exception:
                  return lief.MachO.RPathCommand(rp)

          def _convert_name(name, env_mode, is_id):
              base = os.path.basename(name)
              if env_mode == 'roothide':
                  if name.startswith('/var/jb/'):
                      return '@loader_path/.jbroot' + name[len('/var/jb'):]
                  if name.endswith('CydiaSubstrate.framework/CydiaSubstrate'):
                      return '@loader_path/.jbroot/usr/lib/libsubstrate.dylib'
                  return name
              if is_blacklisted(name):
                  return name
              if env_mode == 'rootful':
                  if base == 'libellekit.dylib':
                      return '@rpath/libsubstrate.dylib' if name.startswith('@rpath/') else '/usr/lib/libsubstrate.dylib'
                  return strip_varjb(name)
              # rootless
              if is_id:
                  if not name.startswith('@rpath/') and not name.startswith('/var/jb/'):
                      return '@rpath/' + base
                  return name
              if name == '/Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate':
                  return '@rpath/libsubstrate.dylib'
              if name.startswith('/Library/Frameworks/'):
                  fw = name.split('/')[-2]
                  return '@rpath/%s.framework/%s' % (fw, fw)
              if name.startswith('/Library/PreferenceBundles/') and name.endswith('.bundle'):
                  return '@rpath/%s/%s' % (base, base.replace('.bundle', ''))
              if name.startswith('/Library/MobileSubstrate/DynamicLibraries/'):
                  return '@rpath/' + base
              if name.startswith('/usr/lib/') or name.startswith('/usr/local/lib/'):
                  return '@rpath/' + base
              return name

          def patch_binary(bin_path, env_mode):
              """env_mode: rootful | rootless | roothide"""
              if not os.path.isfile(bin_path) or os.path.islink(bin_path):
                  return
              ent_file = bin_path + '.ent'
              has_ent = False
              try:
                  with open(ent_file, 'w') as f:
                      r = subprocess.run(['ldid', '-e', bin_path], stdout=f, stderr=subprocess.DEVNULL)
                  has_ent = (r.returncode == 0 and os.path.getsize(ent_file) > 0)
              except Exception:
                  pass
              is_exec = False
              needs_jbroot_link = False
              try:
                  fat = lief.MachO.parse(bin_path)
                  if fat is None:
                      return
                  changed = False
                  for binary in fat:
                      is_exec = is_exec or ('EXECUTE' in str(binary.header.file_type))
                      needs_rpath = False
                      for cmd in binary.commands:
                          t = _ctype(cmd)
                          if t in DEP_TYPES or t == 'ID_DYLIB':
                              new = _convert_name(cmd.name, env_mode, t == 'ID_DYLIB')
                              if new != cmd.name:
                                  cmd.name = new
                                  changed = True
                              if new.startswith('@loader_path/.jbroot'):
                                  needs_jbroot_link = True
                              if new.startswith('@rpath/') and t in DEP_TYPES:
                                  needs_rpath = True
                          elif t == 'RPATH':
                              p = cmd.path
                              if env_mode == 'roothide' and p.startswith('/var/jb/'):
                                  cmd.path = '@loader_path/.jbroot' + p[len('/var/jb'):]
                                  changed = True
                                  needs_jbroot_link = True
                              elif env_mode == 'rootful':
                                  np_ = strip_varjb(p)
                                  if np_ != p:
                                      cmd.path = np_
                                      changed = True
                      # thêm RPATH: roothide chỉ thêm khi thật sự có dependency @rpath/ (và chỉ dạng @loader_path/.jbroot)
                      if env_mode == 'roothide':
                          rps = ['@loader_path/.jbroot/usr/lib', '@loader_path/.jbroot/usr/local/lib',
                                 '@loader_path/.jbroot/Library/Frameworks',
                                 '@loader_path/.jbroot/Library/PreferenceBundles',
                                 '@loader_path/.jbroot/Library/MobileSubstrate/DynamicLibraries']
                          do_add = needs_rpath
                          if do_add:
                              needs_jbroot_link = True
                      elif env_mode == 'rootless':
                          rps = ['/var/jb/usr/lib', '/var/jb/usr/local/lib', '/var/jb/Library/Frameworks',
                                 '/var/jb/Library/PreferenceBundles', '/var/jb/Library/MobileSubstrate/DynamicLibraries']
                          do_add = True
                      else:
                          rps = ['/usr/lib', '/usr/local/lib', '/Library/Frameworks',
                                 '/Library/PreferenceBundles', '/Library/MobileSubstrate/DynamicLibraries',
                                 '/Library/Frameworks/CydiaSubstrate.framework']
                          do_add = True
                      if do_add:
                          existing = {c.path for c in binary.commands if _ctype(c) == 'RPATH'}
                          for rp in rps:
                              if rp not in existing:
                                  try:
                                      binary.add(_new_rpath(rp))
                                      changed = True
                                  except Exception as e:
                                      sys.stderr.write("[rpath] %s %s: %r\n" % (bin_path, rp, e))
                  if changed:
                      fat.write(bin_path)
              except Exception as e:
                  sys.stderr.write("[patch_binary] %s: %r\n" % (bin_path, e))
              # symlink .jbroot cạnh binary (relative -> trỏ về gốc jbroot)
              if env_mode == 'roothide' and needs_jbroot_link:
                  try:
                      rel = os.path.relpath(os.path.dirname(bin_path), 'temp_dir')
                      depth = 0 if rel == '.' else len(rel.split(os.sep))
                      target = '/'.join(['..'] * depth) if depth else '.'
                      link = os.path.join(os.path.dirname(bin_path), '.jbroot')
                      if not os.path.lexists(link):
                          os.symlink(target, link)
                  except Exception as e:
                      sys.stderr.write("[symlink] %r\n" % (e,))
              # ---- Patch strings trong binary (chi rootful) ----
              _patch_binary_strings(bin_path, env_mode)
              # ---- Resign đúng theo môi trường ----
              try:
                  if env_mode == 'roothide' and is_exec:
                      # executable roothide: dùng -M + entitlements (theo RootHide Patcher)
                      if has_ent:
                          subprocess.run(['ldid', '-M', f'-S{ent_file}', bin_path], stderr=subprocess.DEVNULL)
                      else:
                          subprocess.run(['ldid', '-M', '-Sroothide.entitlements', bin_path], stderr=subprocess.DEVNULL)
                  elif has_ent:
                      subprocess.run(['ldid', f'-S{ent_file}', bin_path], stderr=subprocess.DEVNULL)
                  else:
                      subprocess.run(['ldid', '-S', bin_path], stderr=subprocess.DEVNULL)
              except Exception:
                  pass
              try:
                  if os.path.exists(ent_file): os.remove(ent_file)
              except Exception:
                  pass

          def patch_plists(directory, env_mode):
              for root, dirs, files in os.walk(directory):
                  for file in files:
                      if file.endswith('.plist'):
                          path = os.path.join(root, file)
                          try:
                              with open(path, 'rb') as f:
                                  plist = plistlib.load(f)
                              def replace_in_plist(obj):
                                  if isinstance(obj, str):
                                      if is_blacklisted(obj):
                                          return obj
                                      if env_mode == 'rootful' or env_mode == 'roothide':
                                          # rootful & roothide: bỏ /var/jb prefix (roothide di chuyển lên gốc, map .jbroot runtime)
                                          if obj.startswith("/var/jb/"):
                                              return obj[len("/var/jb"):]
                                          return obj
                                      else:  # rootless
                                          if obj.startswith("/Library/") or obj.startswith("/usr/") or obj.startswith("/var/"):
                                              if not obj.startswith("/var/jb/") and not obj.startswith("/var/mobile/"):
                                                  return "/var/jb" + obj
                                          return obj
                                  elif isinstance(obj, dict):
                                      return {k: replace_in_plist(v) for k, v in obj.items()}
                                  elif isinstance(obj, list):
                                      return [replace_in_plist(v) for v in obj]
                                  return obj
                              plist = replace_in_plist(plist)
                              with open(path, 'wb') as f:
                                  plistlib.dump(plist, f)
                          except Exception:
                              pass

          def patch_text_files(directory, env_mode):
              """Chuyen sach duong dan /var/jb trong TAT CA file text (.sh/.json/.strings/.conf/.entitlements/.py...) — tranh sot duong dan gay loi ellekit/setting."""
              TEXT_EXT = ('.sh', '.json', '.strings', '.conf', '.cfg', '.py', '.txt', '.xml', '.entitlements', '.rules', '.yaml', '.yml', '.plist', '.lproj', '.override')
              TEXT_NAMES = ('Filter', 'control', 'postinst', 'prerm', 'postrm', 'extrainst_', 'preinst')
              for root, dirs, files in os.walk(directory):
                  for file in files:
                      path = os.path.join(root, file)
                      if not (file.endswith(TEXT_EXT) or file in TEXT_NAMES or '.lproj/' in path.replace('\\','/')):
                          continue
                      try:
                          with open(path, 'rb') as f:
                              raw_bytes = f.read()
                          # bo qua file binary/co null byte
                          if b'\x00' in raw_bytes:
                              continue
                          content = raw_bytes.decode('utf-8', errors='replace')
                          if env_mode in ('rootful', 'roothide'):
                              # thay /var/jb/ -> / ; /var/jb rieng le -> /
                              new = content.replace('/var/jb/', '/')
                              new = re.sub(r'(?<![\w/])/var/jb(?![\w/])', '/', new)
                          else:
                              new = content
                          if new != content:
                              with open(path, 'wb') as f:
                                  f.write(new.encode('utf-8'))
                      except Exception:
                          pass

          def verify_deb(deb_path, env_mode):
              """Verify nghiêm túc: giải nén lại, kiểm tra CÒN /var/jb trong load commands + control đúng. In PASS/WARN."""
              import tempfile, shutil, subprocess
              if not os.path.exists(deb_path):
                  print(f"[FAIL] {deb_path} KHONG TON TAI")
                  return
              sz = os.path.getsize(deb_path)
              if sz < 1024:
                  print(f"[FAIL] {deb_path} QUA NHO ({sz} bytes) — bi hong")
                  return
              d = tempfile.mkdtemp()
              try:
                  subprocess.run(['dpkg-deb', '-R', deb_path, d], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  # kiem tra filesystem: rootful & roothide KHONG duoc con var/jb
                  if env_mode != 'rootless' and os.path.isdir(os.path.join(d, 'var', 'jb')):
                      print(f"[FAIL] {os.path.basename(deb_path)} VAN CON thu muc var/jb trong deb (chua relocate)")
                  bad = []
                  for root, dirs, files in os.walk(d):
                      for file in files:
                          p = os.path.join(root, file)
                          try:
                              b = lief.parse(p)
                              if b and b.format == lief.Binary.FORMATS.MACHO:
                                  for cmd in b.commands:
                                      nm = getattr(cmd, 'name', None)
                                      pt = getattr(cmd, 'path', None)
                                      if nm and '/var/jb' in nm:
                                          bad.append((os.path.basename(p), nm))
                                      if pt and '/var/jb' in pt:
                                          bad.append((os.path.basename(p), pt))
                          except: pass
                  if bad:
                      print(f"[WARN] {os.path.basename(deb_path)} ({env_mode}) con /var/jb trong {len(bad)} load command(s): {bad[:2]}")
                  else:
                      # canh bao them: neu rootful ma con load libellekit -> se khong chay
                      dylibs = set()
                      try:
                          b2 = lief.parse(deb_path)
                          if b2 and b2.format == lief.Binary.FORMATS.MACHO:
                              for c2 in b2.commands:
                                  nm2 = getattr(c2, 'name', None)
                                  if nm2: dylibs.add(os.path.basename(nm2))
                      except: pass
                      warn_dylibs = []
                      if env_mode == 'rootful' and 'libellekit.dylib' in dylibs:
                          warn_dylibs.append('libellekit.dylib (khong ton tai tren rootful)')
                      if warn_dylibs:
                          print(f"[WARN] {os.path.basename(deb_path)} ({env_mode}) co the khong chay: {', '.join(warn_dylibs)}")
                      else:
                          print(f"[PASS] {os.path.basename(deb_path)} ({env_mode}) — khong con /var/jb, size={sz} bytes, {len(dylibs)} dylibs")
              except Exception as e:
                  print(f"[FAIL] {deb_path} verify loi: {e}")
              finally:
                  shutil.rmtree(d, ignore_errors=True)

          def patch_control(path, target_arch, env_mode, icon_url=''):
              """PARSE CHUẨN DEBIAN: tach field + continuation -> dict -> viet lai theo thu tu chuan. KHONG the sai."""
              with open(path, 'r') as f:
                  raw = f.read()
              # 1. Parse tung field (ke ca continuation) — regex: field name + value den field tiep theo hoac cuoi
              def _norm_field(n):
                  return '-'.join(p.capitalize() for p in n.lower().split('-'))
              field_re = re.compile(r'(?ms)^([A-Za-z][A-Za-z0-9-]*):[ \t]*(.*?)(?=\n[A-Za-z][A-Za-z0-9-]*:|\Z)')
              fields = {}
              order = []
              for m in field_re.finditer(raw):
                  raw_name = m.group(1)
                  name = _norm_field(raw_name)  # normalize: depends -> Depends, installed-size -> Installed-Size
                  val = m.group(2).rstrip()
                  if name != 'Description':
                      val = re.sub(r'\n[ \t]+', ' ', val).strip()
                  if name in fields:
                      # TRUNG field -> gop (voi Depends/Conflicts/Replaces/Provides noi bang ', ', con lai giu gia tri dau)
                      if name in ('Depends','Conflicts','Replaces','Provides','Suggests','Recommends','Enhances','Pre-Depends'):
                          fields[name] = fields[name].rstrip().rstrip(',') + ', ' + val.lstrip(',')
                      # cac field khac: giu gia tri dau (khong ghi de)
                  else:
                      order.append(name)
                      fields[name] = val
              # 2. Cap nhat cac field can thay
              if 'Package' in fields:
                  fields['Package'] = re.sub(r'\.(roothide|rootless|rootful)$', '', fields['Package'].strip())
              fields['Architecture'] = target_arch
              # 3. Xu ly Depends
              deps_str = fields.get('Depends', '')
              for pat in [r'\bmobilesubstrate\b(\s*\([^)]*\))?', r'\bpreferenceloader\b(\s*\([^)]*\))?',
                          r'\broothide\b(\s*\([^)]*\))?', r'\bellekit\b(\s*\([^)]*\))?',
                          r'\bsubstrate\b(\s*\([^)]*\))?']:
                  deps_str = re.sub(pat, '', deps_str)
              dep_list = []
              for d in re.split(r',', deps_str):
                  d = d.strip().strip(',').strip()
                  if not d: continue
                  pkgname = re.split(r'[\s(]', d, 1)[0].strip()
                  if not re.match(r'^[a-zA-Z0-9][a-zA-Z0-9+._-]*$', pkgname): continue
                  dep_list.append(d)
              if env_mode == 'rootful':
                  new_deps = ['mobilesubstrate', 'preferenceloader'] + dep_list
              elif env_mode == 'roothide':
                  new_deps = ['roothide', 'ellekit', 'preferenceloader'] + dep_list
              else:
                  new_deps = ['ellekit', 'preferenceloader'] + dep_list
              final_deps = []
              seen = set()
              for d in new_deps:
                  key = re.split(r'[\s(]', d, 1)[0].strip().lower()
                  if key and key not in seen:
                      seen.add(key)
                      final_deps.append(d.strip())
              if final_deps:
                  fields['Depends'] = ', '.join(final_deps)
              elif 'Depends' in fields:
                  del fields['Depends']
              # Them Icon neu co URL (tu thu muc icon/ trong repo)
              if icon_url:
                  fields['Icon'] = icon_url.strip()
                  if 'Icon' not in order:
                      order.append('Icon')
              # 4. Viet lai theo THU TU CHUAN dpkg (dam bao Version/Architecture/Package o dau)
              STD_ORDER = ['Package', 'Name', 'Version', 'Architecture', 'Section', 'Priority',
                           'Depends', 'Pre-Depends', 'Conflicts', 'Replaces', 'Provides',
                           'Suggests', 'Recommends', 'Enhances', 'Description', 'Maintainer',
                           'Author', 'Homepage', 'Tag', 'Icon', 'Installed-Size']
              out = []
              written = set()
              for fn in STD_ORDER:
                  if fn in fields and fn not in written:
                      val = fields[fn]
                      if fn == 'Description':
                          # Description: dong dau + continuation (neu co newline thi giu, dong tiep theo bat dau bang space)
                          lines = val.split('\n')
                          out.append(f'Description: {lines[0]}\n')
                          for ln in lines[1:]:
                              if ln.strip():
                                  out.append(' ' + ln.strip() + '\n')
                              else:
                                  out.append(' .\n')
                      else:
                          out.append(f'{fn}: {val}\n')
                      written.add(fn)
              # cac field con lai (theo thu tu xuat hien goc)
              for fn in order:
                  if fn not in written:
                      val = fields[fn]
                      out.append(f'{fn}: {val}\n')
                      written.add(fn)
              with open(path, 'w') as f:
                  f.writelines(out)
              # 5. DEBUG
              try:
                  import sys as _sys
                  with open(path) as _f:
                      _sys.stderr.write("=== DEBUG control after patch ===\n" + _f.read() + "=== END DEBUG ===\n")
              except: pass

          def relocate_roothide(temp_dir):
              """Di chuyển /var/jb/* lên gốc, file còn lại -> /rootfs/ (theo RootHide Patcher chuẩn)"""
              import shutil
              jb = os.path.join(temp_dir, 'var', 'jb')
              # FIX ROOTHIDE #3: deb gốc không có /var/jb (rootful) -> giữ nguyên, KHÔNG đẩy mọi thứ vào /rootfs/
              if not os.path.isdir(jb):
                  return
              kept_from_jb = set()
              if os.path.isdir(jb):
                  for item in os.listdir(jb):
                      s = os.path.join(jb, item)
                      d = os.path.join(temp_dir, item)
                      if os.path.exists(d):
                          if os.path.isdir(s):
                              for sub in os.listdir(s):
                                  os.makedirs(d, exist_ok=True)
                                  try: os.rename(os.path.join(s, sub), os.path.join(d, sub))
                                  except: pass
                          else:
                              try:
                                  os.remove(d)
                                  os.rename(s, d)
                              except: pass
                      else:
                          try: os.rename(s, d)
                          except: pass
                      kept_from_jb.add(item)
                  # xoa var/jb va var (ignore error neu co dotfile)
                  shutil.rmtree(jb, ignore_errors=True)
                  var_dir = os.path.join(temp_dir, 'var')
                  if os.path.isdir(var_dir) and not os.listdir(var_dir):
                      try: os.rmdir(var_dir)
                      except: pass
              # file con lai (rootfs) chuyen vao /rootfs/ — CHI giu cac thu muc da di chuyen tu /var/jb
              rootfs = os.path.join(temp_dir, 'rootfs')
              os.makedirs(rootfs, exist_ok=True)
              # cac thu muc duoc phep o goc: nhung thu muc den tu /var/jb (thuong la Applications, Library, usr, bin, sbin, etc)
              KEEP_AT_ROOT = {'Applications','Library','usr','bin','sbin','etc'}
              for item in os.listdir(temp_dir):
                  if item in ('DEBIAN', 'rootfs'):
                      continue
                  s = os.path.join(temp_dir, item)
                  if item in kept_from_jb and item in KEEP_AT_ROOT:
                      continue  # thu muc tu /var/jb -> giu o goc
                  if os.path.isdir(s) and item in KEEP_AT_ROOT and item in kept_from_jb:
                      continue
                  # moi thu khac (var, System, private, file rootfs...) -> vao /rootfs/
                  d = os.path.join(rootfs, item)
                  try:
                      if os.path.exists(d):
                          shutil.rmtree(d, ignore_errors=True)
                      os.rename(s, d)
                  except: pass
          PYEOF

          echo "=== DỌN DẸP FILE CŨ (giữ NGUYÊN deb gốc làm rootless arm64) ==="
          rm -f debs/*_rootful_iphoneos-arm.deb
          rm -f debs/*_roothide_iphoneos-arm64e.deb

          echo "=== ĐỔI TÊN DEB KHÔNG KHOẢNG TRÁNG (tránh Sileo -1 byte) ==="
          for f in debs/*.deb; do
            [ -f "$f" ] || continue
            newname=$(echo "$f" | sed 's/ /_/g; s/[()]/_/g; s/__*/_/g')
            if [ "$f" != "$newname" ]; then mv -f "$f" "$newname"; echo "  -> doi ten: $f => $newname"; fi
          done
          echo "=== TỰ ĐỘNG PHÁT HIỆN MÔI TRƯỜNG GỐC → BUILD 2 VÙNG CÒN LẠI (đủ 3 vùng chuẩn) ==="
          for deb in debs/*.deb; do
            [ -f "$deb" ] || continue
            # bo qua cac deb da la output (co _rootful_/_rootless_/_roothide_ trong ten)
            case "$deb" in
              *_rootful_*|*_rootless_*|*_roothide_*) continue ;;
            esac
            ORIG_ARCH=$(dpkg-deb -f "$deb" Architecture 2>/dev/null || echo "iphoneos-arm64")
            PKG_NAME=$(dpkg-deb -f "$deb" Package)
            PKG_VER=$(dpkg-deb -f "$deb" Version)
            case "$ORIG_ARCH" in
              iphoneos-arm)    ORIG_ENV=rootful;  TARGETS="rootless:iphoneos-arm64 roothide:iphoneos-arm64e" ;;
              iphoneos-arm64e) ORIG_ENV=roothide; TARGETS="rootless:iphoneos-arm64 rootful:iphoneos-arm" ;;
              *)               ORIG_ENV=rootless; TARGETS="rootful:iphoneos-arm roothide:iphoneos-arm64e" ;;
            esac
            ICON_FILE="icon/${PKG_NAME}.png"
            if [ -f "$ICON_FILE" ]; then
              ICON_URL="${PAGES_URL}icon/${PKG_NAME}.png"
              echo "  -> Tim thay icon: $ICON_FILE => $ICON_URL"
            else
              ICON_URL=""
            fi
            echo "--> Gốc: $deb (môi trường: $ORIG_ENV / $ORIG_ARCH) — giữ nguyên làm 1 vùng"
            for TARGET in $TARGETS; do
              T_ENV=${TARGET%%:*}
              T_ARCH=${TARGET##*:}
              echo "  [1/5] Build $T_ENV ($T_ARCH) — giải nén..."
              rm -rf temp_dir
              dpkg-deb -R "$deb" temp_dir
              if [ "$T_ENV" = "roothide" ]; then
                echo "  [2/5] Di chuyển /var/jb lên gốc + /rootfs/ (roothide)..."
                python3 -c "import patch; patch.relocate_roothide('temp_dir')"
              elif [ "$T_ENV" = "rootful" ]; then
                echo "  [2/5] Di chuyển /var/jb lên gốc (rootful — không dùng /var/jb)..."
                python3 -c "import patch; patch.relocate_rootful('temp_dir')"
              else
                echo "  [2/5] Bỏ qua relocate (rootless giữ /var/jb)"
              fi
              echo "  [3/5] Patch control + plists + text files..."
              python3 -c "import patch; patch.patch_control('temp_dir/DEBIAN/control', '$T_ARCH', '$T_ENV', '$ICON_URL')"
              python3 -c "import patch; patch.patch_plists('temp_dir', '$T_ENV')"
              python3 -c "import patch; patch.patch_text_files('temp_dir', '$T_ENV')"
              echo "  [4/5] Patch Mach-O binaries (LOAD_DYLIB/WEAK/REEXPORT + RPATH + resign)..."
              find temp_dir -type f -exec sh -c 'file -b "$1" | grep -q Mach-O && printf "%s\n" "$1"' _ {} \; | while IFS= read -r bin; do
                  python3 -c "import patch; patch.patch_binary('$bin', '$T_ENV')"
              done
              echo "  [5/5] Đóng gói deb $T_ENV..."
              if dpkg-deb --help 2>/dev/null | grep -q zstd; then ZSTD='-Zzstd'; else ZSTD=''; fi
              fakeroot dpkg-deb -b --root-owner-group $ZSTD temp_dir "debs/${PKG_NAME}_${PKG_VER}_${T_ENV}_${T_ARCH}.deb"
              python3 -c "import patch; patch.verify_deb('debs/${PKG_NAME}_${PKG_VER}_${T_ENV}_${T_ARCH}.deb', '$T_ENV')"
              rm -rf temp_dir
              echo "  ✅ Xong: debs/${PKG_NAME}_${PKG_VER}_${T_ENV}_${T_ARCH}.deb"
            done
            echo "=== Hoàn thành $PKG_NAME (gốc $ORIG_ENV + 2 vùng tách) ==="
          done

          rm -f patch.py roothide.entitlements

      - name: Generate Packages (Clean)
        run: |
          rm -f Packages Packages.bz2 Packages.xz Packages.zst
          dpkg-scanpackages -m ./debs /dev/null > Packages
          bzip2 -kf Packages
          xz -kf Packages
          echo "=== KIỂM TRA KÍCH THƯỚC FILE ==="
          grep -E "^(Package|Architecture|Size|Filename):" Packages

      - name: Generate Release
        run: |
          cat > Release <<'EOF'
          Origin: TaoJB
          Label: TaoJB
          Suite: stable
          Version: 1.0
          Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Kho tweak ca nhan cua TaoJB — 3 moi truong rootful/rootless/roothide chuan 100%
          EOF

      - name: Cancel in-progress Pages deployment (tránh lỗi "in progress deployment")
        run: |
          echo "=== Hủy các Pages deployment đang chạy (nếu có) ==="
          DEPLOYS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments" || echo "[]")
          echo "$DEPLOYS" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
          except:
              data = []
          ids = [d.get('id') for d in data if isinstance(d, dict) and d.get('status') in ('in_progress','in_progress_queue')]
          for i in ids:
              print(i)
          " | while read -r dep_id; do
              [ -n "$dep_id" ] || continue
              echo "Hủy deployment $dep_id..."
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/$dep_id/cancel" || true
              sleep 2
          done
          echo "=== Đã hủy xong (nếu có) ==="

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Packages Packages.bz2 Packages.xz Release debs/ icon/ 2>/dev/null || git add Packages Packages.bz2 Packages.xz Release debs/
          git commit -m "Perfect 3-Env Build — rootful/rootless/roothide + @rpath/.jbroot + zstd [skip ci]" || exit 0
          git pull origin main --rebase
          git push origin main
