name: Build Sileo Repo (Safe Text-Only Patch)

on:
  push:
    paths:
      - 'debs/**.deb'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 fakeroot python3
          
      - name: Process Debs Safely
        run: |
          cat << 'PYEOF' > patch.py
          import sys
          def patch_control(path, target_arch, is_roothide=False):
              with open(path, 'r') as f: lines = f.readlines()
              with open(path, 'w') as f:
                  for line in lines:
                      if line.startswith('Architecture:'): 
                          f.write(f'Architecture: {target_arch}\n')
                      elif line.startswith('Package:'):
                          pkg_id = line.replace('Package:', '').strip()
                          pkg_id = pkg_id.replace('.roothide', '').replace('.rootless', '').replace('.rootful', '')
                          f.write(f'Package: {pkg_id}\n')
                      elif line.startswith('Depends:') and is_roothide:
                          # Đổi mobilesubstrate thành roothide cho chuẩn môi trường
                          f.write(line.replace('mobilesubstrate', 'roothide'))
                      else: 
                          f.write(line)
                          
          if __name__ == '__main__':
              mode = sys.argv[1]
              control_path = sys.argv[2]
              if mode == 'rootful': patch_control(control_path, 'iphoneos-arm')
              elif mode == 'roothide': patch_control(control_path, 'iphoneos-arm64e', True)
          PYEOF

          echo "=== 1. XOÁ 2 VÙNG CŨ (ROOTFUL VÀ ROOTHIDE) ==="
          rm -f debs/*_rootful_iphoneos-arm.deb
          rm -f debs/*_roothide_iphoneos-arm64e.deb

          echo "=== 2. QUÉT FILE GỐC (ARM64) VÀ TÁCH RA 2 VÙNG ==="
          for deb in debs/*.deb; do
            [ -f "$deb" ] || continue
            
            if [[ "$deb" != *"_rootful_"* ]] && [[ "$deb" != *"_roothide_"* ]]; then
              if [[ "$deb" == *"arm64"* ]]; then
                echo "--> Đang xử lý file gốc: $deb"
                PKG_NAME=$(dpkg-deb -f "$deb" Package)
                PKG_VER=$(dpkg-deb -f "$deb" Version)
                
                # BẢN ROOTFUL (Chỉ sửa text)
                dpkg-deb -R "$deb" temp_dir
                python3 patch.py rootful temp_dir/DEBIAN/control
                find temp_dir -type f -name "*.plist" -exec sed -i 's|/var/jb/|/|g' {} +
                dpkg-deb -b temp_dir "debs/${PKG_NAME}_${PKG_VER}_rootful_iphoneos-arm.deb" > /dev/null
                rm -rf temp_dir
                
                # BẢN ROOTHIDE (Chỉ sửa text, KHÔNG ký lại binary)
                dpkg-deb -R "$deb" temp_dir
                python3 patch.py roothide temp_dir/DEBIAN/control
                find temp_dir -type f -name "*.plist" -exec sed -i 's|/Library/|/var/jb/Library/|g' {} +
                dpkg-deb -b temp_dir "debs/${PKG_NAME}_${PKG_VER}_roothide_iphoneos-arm64e.deb" > /dev/null
                rm -rf temp_dir
                
                echo "=== Đã tách xong 2 vùng an toàn cho: $PKG_NAME ==="
              fi
            fi
          done
          
          rm -f patch.py

      - name: Generate Packages
        run: |
          dpkg-scanpackages -m ./debs /dev/null > Packages
          grep "^Package:\|^Architecture:" Packages || echo "Không có gói nào!"
          bzip2 -kf Packages || true
          
      - name: Generate Release
        run: |
          cat > Release <<'EOF'
          Origin: TaoJB
          Label: TaoJB
          Suite: stable
          Version: 1.0
          Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Kho tweak ca nhan cua TaoJB
          EOF
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Packages Packages.bz2 Release debs/
          git commit -m "Safe split (Text-only patch) [skip ci]" || exit 0
          git pull origin main --rebase
          git push origin main
