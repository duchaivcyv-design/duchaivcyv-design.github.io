name: Build Sileo Repo (Keep Rootless Original)

on:
  push:
    paths:
      - 'debs/**.deb'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 fakeroot python3 pip python3-pip wget unzip
          pip3 install lief
          
      - name: Install ldid
        run: |
          wget https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          sudo mv ldid_linux_x86_64 /usr/local/bin/ldid

      - name: Process Debs (Keep Rootless & Split 2 Envs)
        run: |
          cat << 'PYEOF' > patch.py
          import sys, os, subprocess
          import lief
          import re

          def patch_binary(bin_path, is_rootless):
              if not os.path.exists(bin_path): return
              ent_file = bin_path + ".ent"
              has_ent = False
              try:
                  with open(ent_file, 'w') as f:
                      res = subprocess.run(['ldid', '-e', bin_path], stdout=f, stderr=subprocess.DEVNULL)
                      if res.returncode == 0 and os.path.getsize(ent_file) > 0:
                          has_ent = True
              except: pass

              try:
                  binary = lief.parse(bin_path)
                  if binary and binary.format == lief.Binary.FORMATS.MACHO:
                      changed = False
                      for cmd in binary.commands:
                          if cmd.command == lief.MachO.LoadCommand.TYPE.RPATH:
                              if is_rootless and '/var/jb' not in cmd.path:
                                  cmd.path = '/var/jb' + cmd.path
                                  changed = True
                          elif cmd.command == lief.MachO.LoadCommand.TYPE.LOAD_DYLIB:
                              if is_rootless and '/var/jb' not in cmd.name and cmd.name.startswith('/Library/'):
                                  cmd.name = '/var/jb' + cmd.name
                                  changed = True
                      if changed:
                          binary.write(bin_path)
              except Exception: pass

              try:
                  if has_ent:
                      subprocess.run(['ldid', f'-S{ent_file}', bin_path], stderr=subprocess.DEVNULL)
                      os.remove(ent_file)
                  else:
                      subprocess.run(['ldid', '-S', bin_path], stderr=subprocess.DEVNULL)
              except: pass

          def patch_plists(directory, is_rootless):
              for root, dirs, files in os.walk(directory):
                  for file in files:
                      if file.endswith('.plist'):
                          path = os.path.join(root, file)
                          try:
                              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                                  content = f.read()
                              if is_rootless:
                                  content = content.replace('/var/jb/var/jb/', '/var/jb/')
                                  content = content.replace('/Library/', '/var/jb/Library/')
                              else:
                                  content = content.replace('/var/jb/', '/')
                              with open(path, 'w', encoding='utf-8') as f:
                                  f.write(content)
                          except: pass

          def patch_control(path, target_arch, env_mode):
              with open(path, 'r') as f: lines = f.readlines()
              
              new_lines = []
              for line in lines:
                  if line.startswith('Architecture:'): 
                      new_lines.append(f'Architecture: {target_arch}\n')
                  elif line.startswith('Package:'):
                      pkg_id = line.replace('Package:', '').strip()
                      pkg_id = pkg_id.replace('.roothide', '').replace('.rootless', '').replace('.rootful', '')
                      new_lines.append(f'Package: {pkg_id}\n')
                  elif line.startswith('Depends:'):
                      deps = line.replace('Depends:', '').strip()
                      
                      # Xóa mobilesubstrate và preferenceloader kèm theo version (nếu có)
                      deps = re.sub(r'\bmobilesubstrate\b\s*(\([^)]*\))?\s*,?', '', deps)
                      deps = re.sub(r'\bpreferenceloader\b\s*(\([^)]*\))?\s*,?', '', deps)
                      
                      dep_list = [d.strip() for d in deps.split(',') if d.strip()]
                      
                      if env_mode == 'rootful':
                          new_deps = ['mobilesubstrate', 'preferenceloader'] + dep_list
                      elif env_mode == 'roothide':
                          new_deps = ['roothide', 'ellekit', 'preferenceloader'] + dep_list
                          
                      final_deps = []
                      for d in new_deps:
                          if d not in final_deps:
                              final_deps.append(d)
                              
                      new_lines.append(f'Depends: {", ".join(final_deps)}\n')
                  else: 
                      new_lines.append(line)
                      
              with open(path, 'w') as f:
                  f.writelines(new_lines)
          PYEOF

          echo "=== 1. CHỈ XOÁ 2 VÙNG CŨ (ROOTFUL VÀ ROOTHIDE) ==="
          # Không xóa file rootless gốc
          rm -f debs/*_rootful_iphoneos-arm.deb
          rm -f debs/*_roothide_iphoneos-arm64e.deb

          echo "=== 2. QUÉT FILE GỐC VÀ TÁCH RA 2 VÙNG ==="
          for deb in debs/*.deb; do
            [ -f "$deb" ] || continue
            
            if [[ "$deb" != *"_rootful_"* ]] && [[ "$deb" != *"_roothide_"* ]]; then
              if [[ "$deb" == *"arm64"* ]]; then
                echo "--> Xử lý file gốc: $deb"
                PKG_NAME=$(dpkg-deb -f "$deb" Package)
                PKG_VER=$(dpkg-deb -f "$deb" Version)
                
                # --- A. TẠO BẢN ROOTFUL (arm) ---
                dpkg-deb -R "$deb" temp_dir
                python3 -c "import patch; patch.patch_control('temp_dir/DEBIAN/control', 'iphoneos-arm', 'rootful')"
                python3 -c "import patch; patch.patch_plists('temp_dir', False)"
                find temp_dir -type f -exec file {} \; | grep "Mach-O" | cut -d: -f1 | while read bin; do
                    python3 -c "import patch; patch.patch_binary('$bin', False)"
                done
                dpkg-deb -b temp_dir "debs/${PKG_NAME}_${PKG_VER}_rootful_iphoneos-arm.deb" > /dev/null
                rm -rf temp_dir
                
                # --- B. TẠO BẢN ROOTHIDE (arm64e) ---
                dpkg-deb -R "$deb" temp_dir
                python3 -c "import patch; patch.patch_control('temp_dir/DEBIAN/control', 'iphoneos-arm64e', 'roothide')"
                python3 -c "import patch; patch.patch_plists('temp_dir', True)"
                find temp_dir -type f -exec file {} \; | grep "Mach-O" | cut -d: -f1 | while read bin; do
                    python3 -c "import patch; patch.patch_binary('$bin', True)"
                done
                dpkg-deb -b temp_dir "debs/${PKG_NAME}_${PKG_VER}_roothide_iphoneos-arm64e.deb" > /dev/null
                rm -rf temp_dir
                
                echo "=== Đã tách xong 2 vùng cho: $PKG_NAME (Giữ nguyên file gốc Rootless) ==="
              fi
            fi
          done
          
          rm -f patch.py

      - name: Generate Packages
        run: |
          dpkg-scanpackages -m ./debs /dev/null > Packages
          grep "^Package:\|^Architecture:" Packages || echo "Không có gói nào!"
          bzip2 -kf Packages || true
          
      - name: Generate Release
        run: |
          cat > Release <<'EOF'
          Origin: TaoJB
          Label: TaoJB
          Suite: stable
          Version: 1.0
          Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Kho tweak ca nhan cua TaoJB (Keep Rootless)
          EOF
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Packages Packages.bz2 Release debs/
          git commit -m "Keep rootless, fix dep parsing with regex [skip ci]" || exit 0
          git pull origin main --rebase
          git push origin main
