name: Build Sileo Repo (True 3-Way Auto-Patcher)

on:
  push:
    paths:
      - 'debs/**.deb'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install Dependencies (dpkg, llvm)
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 fakeroot llvm file

      - name: Auto-Patch and Split to 3 Environments
        run: |
          mkdir -p final_debs
          
          # Quét tất cả file .deb gốc
          for deb in debs/*.deb; do
            if [ -f "$deb" ]; then
              echo "========================================"
              echo "Đang xử lý file gốc: $deb"
              
              PKG_NAME=$(dpkg-deb -f "$deb" Package)
              PKG_VER=$(dpkg-deb -f "$deb" Version)
              
              # ==========================================
              # 1. TẠO BẢN ROOTFUL (iphoneos-arm)
              # ==========================================
              echo "--> Đang tạo bản Rootful..."
              dpkg-deb -R "$deb" temp_rootful
              sed -i 's/^Architecture: .*/Architecture: iphoneos-arm/' temp_rootful/DEBIAN/control
              dpkg-deb -b temp_rootful "final_debs/${PKG_NAME}_${PKG_VER}_rootful_iphoneos-arm.deb" > /dev/null
              rm -rf temp_rootful

              # ==========================================
              # 2. TẠO BẢN ROOTLESS (iphoneos-arm64)
              # ==========================================
              echo "--> Đang tạo bản Rootless (Deep Patch)..."
              dpkg-deb -R "$deb" temp_rootless
              
              # Sửa file control
              sed -i 's/^Architecture: .*/Architecture: iphoneos-arm64/' temp_rootless/DEBIAN/control
              
              # Sửa path trong .plist (Text)
              find temp_rootless -type f -name "*.plist" -exec sed -i 's|/Library/|/var/jb/Library/|g' {} +
              
              # SỬA PATH TRONG BINARY (Dylib & Executables)
              # Tìm tất cả file Mach-O và patch path
              find temp_rootless -type f -exec file {} \; | grep "Mach-O" | cut -d: -f1 > macho_files.txt
              while read -r bin; do
                chmod +x "$bin"
                # Lấy tất cả các path đang có trong binary
                paths=$(llvm-objdump -p "$bin" 2>/dev/null | grep -E "path|name" | grep -v "/System" | grep -v "/usr/lib/libSystem" | awk '{print $2}')
                for p in $paths; do
                  if [[ "$p" == /Library/* ]] || [[ "$p" == /usr/lib/* ]]; then
                    # Thêm /var/jb vào trước path (xử lý cả path dài)
                    new_p="/var/jb$p"
                    llvm-install-name-tool -change "$p" "$new_p" "$bin" 2>/dev/null || true
                  fi
                done
              done < macho_files.txt
              rm macho_files.txt

              dpkg-deb -b temp_rootless "final_debs/${PKG_NAME}_${PKG_VER}_rootless_iphoneos-arm64.deb" > /dev/null
              rm -rf temp_rootless

              # ==========================================
              # 3. TẠO BẢN ROOTHIDE (iphoneos-arm64e)
              # ==========================================
              echo "--> Đang tạo bản RootHide (Deep Patch & Depends)..."
              dpkg-deb -R "$deb" temp_roothide
              
              # Sửa control: Đổi Arch, Đổi Tên Package, Ép Depends sang roothide
              sed -i 's/^Architecture: .*/Architecture: iphoneos-arm64e/' temp_roothide/DEBIAN/control
              sed -i "s/^Package: .*/Package: ${PKG_NAME}.roothide/" temp_roothide/DEBIAN/control
              sed -i 's/^Depends: .*mobilesubstrate.*/Depends: roothide, preferenceloader/' temp_roothide/DEBIAN/control
              sed -i 's/^Depends: mobilesubstrate.*/Depends: roothide/' temp_roothide/DEBIAN/control

              # Sửa path trong .plist (RootHide cũng dùng /var/jb/)
              find temp_roothide -type f -name "*.plist" -exec sed -i 's|/Library/|/var/jb/Library/|g' {} +
              
              # SỬA PATH TRONG BINARY
              find temp_roothide -type f -exec file {} \; | grep "Mach-O" | cut -d: -f1 > macho_files.txt
              while read -r bin; do
                chmod +x "$bin"
                paths=$(llvm-objdump -p "$bin" 2>/dev/null | grep -E "path|name" | grep -v "/System" | grep -v "/usr/lib/libSystem" | awk '{print $2}')
                for p in $paths; do
                  if [[ "$p" == /Library/* ]] || [[ "$p" == /usr/lib/* ]]; then
                    new_p="/var/jb$p"
                    llvm-install-name-tool -change "$p" "$new_p" "$bin" 2>/dev/null || true
                  fi
                done
              done < macho_files.txt
              rm macho_files.txt

              dpkg-deb -b temp_roothide "final_debs/${PKG_NAME}_${PKG_VER}_roothide_iphoneos-arm64e.deb" > /dev/null
              rm -rf temp_roothide
              
              echo "Đã xử lý xong: $PKG_NAME"
            fi
          done
          
          # Xóa file gốc, chỉ giữ lại 3 bản đã tách
          rm -rf debs
          mkdir -p debs
          mv final_debs/*.deb debs/ 2>/dev/null || true
          rm -rf final_debs

      - name: Generate Packages
        run: |
          dpkg-scanpackages -m ./debs /dev/null > Packages
          bzip2 -kf Packages
          
      - name: Generate Release
        run: |
          cat > Release <<'EOF'
          Origin: TaoJB
          Label: TaoJB
          Suite: stable
          Version: 1.0
          Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Kho tweak ca nhan cua TaoJB (Auto Split 3 Envs)
          EOF
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Packages Packages.bz2 Release debs/
          git commit -m "Auto-split 3 environments (Rootful, Rootless, RootHide)" || exit 0
          git push
