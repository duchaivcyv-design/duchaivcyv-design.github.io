name: Build Sileo Repo (True Patcher Replica)

on:
  push:
    paths:
      - 'debs/**.deb'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 fakeroot python3 pip python3-pip wget unzip
          pip3 install lief
          
      - name: Install ldid
        run: |
          wget https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          sudo mv ldid_linux_x86_64 /usr/local/bin/ldid

      - name: Process Debs Like A Pro
        run: |
          cat << 'PYEOF' > patch.py
          import sys, os, subprocess
          import lief

          def patch_binary(bin_path, is_rootless):
              if not os.path.exists(bin_path): return
              
              # 1. Trích xuất quyền (Entitlements) gốc
              ent_file = bin_path + ".ent"
              has_ent = False
              try:
                  with open(ent_file, 'w') as f:
                      res = subprocess.run(['ldid', '-e', bin_path], stdout=f, stderr=subprocess.DEVNULL)
                      if res.returncode == 0 and os.path.getsize(ent_file) > 0:
                          has_ent = True
              except:
                  pass

              # 2. Sửa đường dẫn bằng LIEF (An toàn tuyệt đối)
              try:
                  binary = lief.parse(bin_path)
                  if binary and binary.format == lief.Binary.FORMATS.MACHO:
                      changed = False
                      for cmd in binary.commands:
                          if cmd.command == lief.MachO.LoadCommand.TYPE.RPATH:
                              if '/var/jb' not in cmd.path and is_rootless:
                                  cmd.path = '/var/jb' + cmd.path
                                  changed = True
                          elif cmd.command == lief.MachO.LoadCommand.TYPE.LOAD_DYLIB:
                              if '/var/jb' not in cmd.name and is_rootless and cmd.name.startswith('/Library/'):
                                  cmd.name = '/var/jb' + cmd.name
                                  changed = True
                      if changed:
                          binary.write(bin_path)
              except Exception as e:
                  print(f"Lỗi LIEF: {e}")
                  pass

              # 3. Ký lại file (Re-sign) và nạp lại quyền gốc
              try:
                  if has_ent:
                      subprocess.run(['ldid', f'-S{ent_file}', bin_path], stderr=subprocess.DEVNULL)
                      os.remove(ent_file)
                  else:
                      subprocess.run(['ldid', '-S', bin_path], stderr=subprocess.DEVNULL)
              except:
                  pass

          def patch_control(path, target_arch, is_roothide=False):
              with open(path, 'r') as f: lines = f.readlines()
              with open(path, 'w') as f:
                  for line in lines:
                      if line.startswith('Architecture:'): 
                          f.write(f'Architecture: {target_arch}\n')
                      elif line.startswith('Package:'):
                          pkg_id = line.replace('Package:', '').strip()
                          pkg_id = pkg_id.replace('.roothide', '').replace('.rootless', '').replace('.rootful', '')
                          f.write(f'Package: {pkg_id}\n')
                      elif line.startswith('Depends:') and is_roothide:
                          f.write(line.replace('mobilesubstrate', 'roothide'))
                      else: 
                          f.write(line)
          PYEOF

          echo "=== 1. XOÁ 2 VÙNG CŨ ==="
          rm -f debs/*_rootful_iphoneos-arm.deb
          rm -f debs/*_roothide_iphoneos-arm64e.deb

          echo "=== 2. TÁCH VÀ PATCH BINARY CHUẨN PATChER ==="
          for deb in debs/*.deb; do
            [ -f "$deb" ] || continue
            
            if [[ "$deb" != *"_rootful_"* ]] && [[ "$deb" != *"_roothide_"* ]]; then
              if [[ "$deb" == *"arm64"* ]]; then
                echo "--> Xử lý: $deb"
                PKG_NAME=$(dpkg-deb -f "$deb" Package)
                PKG_VER=$(dpkg-deb -f "$deb" Version)
                
                # BẢN ROOTFUL (Đảo ngược)
                dpkg-deb -R "$deb" temp_dir
                python3 -c "import patch; patch.patch_control('temp_dir/DEBIAN/control', 'iphoneos-arm', False)"
                find temp_dir -type f -name "*.plist" -exec sed -i 's|/var/jb/|/|g' {} +
                find temp_dir -type f -exec file {} \; | grep "Mach-O" | cut -d: -f1 | while read bin; do
                    python3 -c "import patch; patch.patch_binary('$bin', False)"
                done
                dpkg-deb -b temp_dir "debs/${PKG_NAME}_${PKG_VER}_rootful_iphoneos-arm.deb" > /dev/null
                rm -rf temp_dir
                
                # BẢN ROOTHIDE (Chuẩn Patcher)
                dpkg-deb -R "$deb" temp_dir
                python3 -c "import patch; patch.patch_control('temp_dir/DEBIAN/control', 'iphoneos-arm64e', True)"
                find temp_dir -type f -name "*.plist" -exec sed -i 's|/Library/|/var/jb/Library/|g' {} +
                find temp_dir -type f -exec file {} \; | grep "Mach-O" | cut -d: -f1 | while read bin; do
                    python3 -c "import patch; patch.patch_binary('$bin', True)"
                done
                dpkg-deb -b temp_dir "debs/${PKG_NAME}_${PKG_VER}_roothide_iphoneos-arm64e.deb" > /dev/null
                rm -rf temp_dir
                
                echo "=== Đã patch xong an toàn cho: $PKG_NAME ==="
              fi
            fi
          done
          
          rm -f patch.py

      - name: Generate Packages
        run: |
          dpkg-scanpackages -m ./debs /dev/null > Packages
          grep "^Package:\|^Architecture:" Packages || echo "Không có gói nào!"
          bzip2 -kf Packages || true
          
      - name: Generate Release
        run: |
          cat > Release <<'EOF'
          Origin: TaoJB
          Label: TaoJB
          Suite: stable
          Version: 1.0
          Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Kho tweak ca nhan cua TaoJB (Pro Patched)
          EOF
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Packages Packages.bz2 Release debs/
          git commit -m "True Patcher Replica (LIEF + Entitlements) [skip ci]" || exit 0
          git pull origin main --rebase
          git push origin main
