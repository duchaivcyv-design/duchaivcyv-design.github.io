name: Build Sileo Repo (True 3-Way Auto-Patcher)

on:
  push:
    paths:
      - 'debs/**.deb'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install Dependencies (dpkg, llvm)
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 fakeroot llvm file python3

      - name: Auto-Patch and Split to 3 Environments
        run: |
          mkdir -p final_debs
          
          for deb in debs/*.deb; do
            if [ -f "$deb" ]; then
              echo "========================================"
              echo "Đang xử lý file gốc: $deb"
              
              PKG_NAME=$(dpkg-deb -f "$deb" Package)
              PKG_VER=$(dpkg-deb -f "$deb" Version)
              
              # ==========================================
              # 1. TẠO BẢN ROOTFUL (iphoneos-arm)
              # ==========================================
              echo "--> Đang tạo bản Rootful..."
              dpkg-deb -R "$deb" temp_rootful
              # Dùng python để sửa Architecture chuẩn xác 100%
              python3 -c "
import re
with open('temp_rootful/DEBIAN/control', 'r') as f: lines = f.readlines()
with open('temp_rootful/DEBIAN/control', 'w') as f:
    for line in lines:
        if line.startswith('Architecture:'): f.write('Architecture: iphoneos-arm\n')
        else: f.write(line)
"
              dpkg-deb -b temp_rootful "final_debs/${PKG_NAME}_${PKG_VER}_rootful_iphoneos-arm.deb" > /dev/null
              rm -rf temp_rootful

              # ==========================================
              # 2. TẠO BẢN ROOTLESS (iphoneos-arm64)
              # ==========================================
              echo "--> Đang tạo bản Rootless..."
              dpkg-deb -R "$deb" temp_rootless
              python3 -c "
with open('temp_rootless/DEBIAN/control', 'r') as f: lines = f.readlines()
with open('temp_rootless/DEBIAN/control', 'w') as f:
    for line in lines:
        if line.startswith('Architecture:'): f.write('Architecture: iphoneos-arm64\n')
        else: f.write(line)
"
              # Patch path
              find temp_rootless -type f -name "*.plist" -exec sed -i 's|/Library/|/var/jb/Library/|g' {} +
              find temp_rootless -type f -exec file {} \; | grep "Mach-O" | cut -d: -f1 > macho.txt
              while read -r bin; do
                chmod +x "$bin"
                paths=$(llvm-objdump -p "$bin" 2>/dev/null | grep -E "path|name" | grep -v "/System" | grep -v "/usr/lib/libSystem" | awk '{print $2}')
                for p in $paths; do
                  [[ "$p" == /Library/* || "$p" == /usr/lib/* ]] && llvm-install-name-tool -change "$p" "/var/jb$p" "$bin" 2>/dev/null || true
                done
              done < macho.txt; rm macho.txt

              dpkg-deb -b temp_rootless "final_debs/${PKG_NAME}_${PKG_VER}_rootless_iphoneos-arm64.deb" > /dev/null
              rm -rf temp_rootless

              # ==========================================
              # 3. TẠO BẢN ROOTHIDE (iphoneos-arm64e)
              # ==========================================
              echo "--> Đang tạo bản RootHide..."
              dpkg-deb -R "$deb" temp_roothide
              python3 -c "
with open('temp_roothide/DEBIAN/control', 'r') as f: lines = f.readlines()
with open('temp_roothide/DEBIAN/control', 'w') as f:
    for line in lines:
        if line.startswith('Architecture:'): f.write('Architecture: iphoneos-arm64e\n')
        elif line.startswith('Package:'): f.write(f'Package: ${PKG_NAME}.roothide\n')
        elif line.startswith('Depends:'): 
            deps = line.replace('Depends:', '').replace('mobilesubstrate', 'roothide').strip()
            f.write(f'Depends: {deps}\n')
        else: f.write(line)
"
              find temp_roothide -type f -name "*.plist" -exec sed -i 's|/Library/|/var/jb/Library/|g' {} +
              find temp_roothide -type f -exec file {} \; | grep "Mach-O" | cut -d: -f1 > macho.txt
              while read -r bin; do
                chmod +x "$bin"
                paths=$(llvm-objdump -p "$bin" 2>/dev/null | grep -E "path|name" | grep -v "/System" | grep -v "/usr/lib/libSystem" | awk '{print $2}')
                for p in $paths; do
                  [[ "$p" == /Library/* || "$p" == /usr/lib/* ]] && llvm-install-name-tool -change "$p" "/var/jb$p" "$bin" 2>/dev/null || true
                done
              done < macho.txt; rm macho.txt

              dpkg-deb -b temp_roothide "final_debs/${PKG_NAME}_${PKG_VER}_roothide_iphoneos-arm64e.deb" > /dev/null
              rm -rf temp_roothide
              
            fi
          done
          
          rm -rf debs
          mkdir -p debs
          mv final_debs/*.deb debs/
          rm -rf final_debs

      - name: Generate Packages
        run: |
          dpkg-scanpackages -m ./debs /dev/null > Packages
          echo "=== KIỂM TRA FILE PACKAGES ==="
          grep "^Package:\|^Architecture:" Packages
          bzip2 -kf Packages
          
      - name: Generate Release
        run: |
          cat > Release <<'EOF'
          Origin: TaoJB
          Label: TaoJB
          Suite: stable
          Version: 1.0
          Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Kho tweak ca nhan cua TaoJB (Auto Split 3 Envs)
          EOF
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Packages Packages.bz2 Release debs/
          git commit -m "Auto-split 3 environments (Python Patched)" || exit 0
          git push
