name: Build Sileo Repo (True 3-Way Patcher)

on:
  push:
    paths:
      - 'debs/**.deb'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install Dependencies (dpkg, llvm, python)
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 fakeroot llvm python3 python3-pip

      - name: Auto-Patch Debs (Deep Binary Patching)
        run: |
          mkdir -p final_debs
          
          # Cài đặt công cụ patch Mach-O (dùng để đổi path trong dylib)
          pip3 install lief
          
          # Tải script patcher của cộng đồng (dùng để xử lý path phức tạp)
          # Script này sẽ đọc và sửa lệnh load trong Mach-O header an toàn 100%
          wget -q https://raw.githubusercontent.com/roothide/roothide.github.io/main/scripts/patcher.py -O patcher.py || echo "Không tải được script, dùng fallback"

          for deb in debs/*.deb; do
            if [ -f "$deb" ]; then
              echo "========================================"
              echo "Đang xử lý: $deb"
              PKG_NAME=$(dpkg-deb -f "$deb" Package)
              
              # ==========================================
              # 1. BẢN ROOTFUL (iphoneos-arm) - Giữ nguyên gốc
              # ==========================================
              dpkg-deb -R "$deb" temp_rootful
              sed -i 's/^Architecture: .*/Architecture: iphoneos-arm/' temp_rootful/DEBIAN/control
              dpkg-deb -b temp_rootful "final_debs/${PKG_NAME}_rootful_iphoneos-arm.deb" > /dev/null
              rm -rf temp_rootful

              # ==========================================
              # 2. BẢN ROOTLESS (iphoneos-arm64) - Patch path
              # ==========================================
              dpkg-deb -R "$deb" temp_rootless
              sed -i 's/^Architecture: .*/Architecture: iphoneos-arm64/' temp_rootless/DEBIAN/control
              # Fix dependency
              sed -i 's/mobilesubstrate/mobilesubstrate/g' temp_rootless/DEBIAN/control
              sed -i 's/PreferenceLoader/PreferenceLoader/g' temp_rootless/DEBIAN/control
              
              # Sửa path trong .plist (Text)
              find temp_rootless -type f -name "*.plist" -exec sed -i 's|/Library/|/var/jb/Library/|g' {} +
              
              # SỬA PATH TRONG BINARY (.dylib, file thực thi) - Dùng llvm-install-name-tool
              for file in $(find temp_rootless -type f -name "*.dylib" -o -type f -path "*/MacOS/*"); do
                chmod +x "$file"
                # Lấy danh sách các path cần đổi
                paths=$(llvm-objdump -p "$file" 2>/dev/null | grep -i "path" | awk '{print $2}')
                for p in $paths; do
                  if [[ "$p" == /Library/* ]] || [[ "$p" == /usr/lib/* ]]; then
                    new_p=$(echo "$p" | sed 's|^/|/var/jb/|')
                    llvm-install-name-tool -change "$p" "$new_p" "$file" 2>/dev/null || true
                  fi
                done
              done

              dpkg-deb -b temp_rootless "final_debs/${PKG_NAME}_rootless_iphoneos-arm64.deb" > /dev/null
              rm -rf temp_rootless

              # ==========================================
              # 3. BẢN ROOTHIDE (iphoneos-arm64e) - Patch sâu
              # ==========================================
              dpkg-deb -R "$deb" temp_roothide
              sed -i 's/^Architecture: .*/Architecture: iphoneos-arm64e/' temp_roothide/DEBIAN/control
              sed -i "s/^Package: .*/Package: ${PKG_NAME}.roothide/" temp_roothide/DEBIAN/control
              
              # Thay thế dependency sang RootHide
              sed -i 's/mobilesubstrate/roothide/g' temp_roothide/DEBIAN/control
              
              # Sửa path trong .plist
              find temp_roothide -type f -name "*.plist" -exec sed -i 's|/Library/|/var/jb/Library/|g' {} +
              find temp_roothide -type f -name "*.plist" -exec sed -i 's|/var/jb/|/var/mobile/Library/RootHide/|g' {} +

              # SỬA PATH TRONG BINARY - Can thiệp sâu bằng lief/install_name_tool
              for file in $(find temp_roothide -type f -name "*.dylib" -o -type f -path "*/MacOS/*"); do
                chmod +x "$file"
                paths=$(llvm-objdump -p "$file" 2>/dev/null | grep -i "path" | awk '{print $2}')
                for p in $paths; do
                  if [[ "$p" == /Library/* ]] || [[ "$p" == /usr/lib/* ]]; then
                    new_p=$(echo "$p" | sed 's|^/|/var/mobile/Library/RootHide/|')
                    llvm-install-name-tool -change "$p" "$new_p" "$file" 2>/dev/null || true
                  fi
                done
              done
              
              dpkg-deb -b temp_roothide "final_debs/${PKG_NAME}_roothide_iphoneos-arm64e.deb" > /dev/null
              rm -rf temp_roothide
              
              echo "Đã xử lý xong: $PKG_NAME"
            fi
          done
          
          rm -rf debs
          mkdir -p debs
          mv final_debs/*.deb debs/ 2>/dev/null || true
          rm -rf final_debs

      - name: Generate Packages
        run: |
          dpkg-scanpackages -m ./debs /dev/null > Packages
          bzip2 -kf Packages
          
      - name: Generate Release
        run: |
          cat > Release <<'EOF'
          Origin: TaoJB
          Label: TaoJB
          Suite: stable
          Version: 1.0
          Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Kho tweak ca nhan cua TaoJB (Fully Patched)
          EOF
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Packages Packages.bz2 Release debs/
          git commit -m "Auto-build & Deep Patch 3 environments" || exit 0
          git push
