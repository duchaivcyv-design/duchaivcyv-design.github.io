name: Build Sileo Repo (Clean & Auto-Split)

on:
  push:
    paths:
      - 'debs/**.deb'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install Dependencies (dpkg, llvm)
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 fakeroot llvm file python3

      - name: Clean and Rebuild Environments
        run: |
          mkdir -p processed_debs
          
          # Tạo script Python để xử lý file control cực kỳ an toàn
          cat << 'PYEOF' > patch.py
          import sys

          def patch_control(path, target_arch, is_roothide=False):
              with open(path, 'r') as f:
                  lines = f.readlines()
              with open(path, 'w') as f:
                  for line in lines:
                      if line.startswith('Architecture:'):
                          f.write(f'Architecture: {target_arch}\n')
                      elif line.startswith('Package:'):
                          # Xóa các đuôi rác do lần build trước để lấy ID gốc
                          pkg_id = line.replace('Package:', '').strip()
                          pkg_id = pkg_id.replace('.roothide', '').replace('.rootless', '').replace('.rootful', '')
                          f.write(f'Package: {pkg_id}\n') # Giữ nguyên ID gốc, Sileo tự phân vùng
                      elif line.startswith('Depends:') and is_roothide:
                          f.write(line.replace('mobilesubstrate', 'roothide'))
                      else:
                          f.write(line)

          if __name__ == '__main__':
              mode = sys.argv[1]
              control_path = sys.argv[2]
              if mode == 'rootful':
                  patch_control(control_path, 'iphoneos-arm')
              elif mode == 'roothide':
                  patch_control(control_path, 'iphoneos-arm64e', True)
          PYEOF

          echo "=== 1. QUÉT VÀ XỬ LÝ FILE GỐC ==="
          for deb in debs/*.deb; do
            if [ -f "$deb" ]; then
              # Bỏ qua các file rác do bot tạo ra từ lần trước
              if [[ "$deb" == *"_rootful_"* ]] || [[ "$deb" == *"_roothide_"* ]] || [[ "$deb" == *"_rootless_"* ]]; then
                continue
              fi
              
              echo "--> Đang xử lý file gốc: $deb"
              PKG_NAME=$(dpkg-deb -f "$deb" Package)
              PKG_VER=$(dpkg-deb -f "$deb" Version)
              
              # ==========================================
              # A. TẠO BẢN ROOTFUL (iphoneos-arm)
              # ==========================================
              dpkg-deb -R "$deb" temp_rootful
              python3 patch.py rootful temp_rootful/DEBIAN/control
              
              # Đảo ngược đường dẫn: Từ /var/jb/Library/ -> /Library/
              find temp_rootful -type f -name "*.plist" -exec sed -i 's|/var/jb/|/|g' {} +
              
              # Sửa đường dẫn trong file binary
              find temp_rootful -type f -exec file {} \; | grep "Mach-O" | cut -d: -f1 > macho.txt
              while read -r bin; do
                chmod +x "$bin"
                paths=$(llvm-objdump -p "$bin" 2>/dev/null | grep -E "path|name" | grep "/var/jb" | awk '{print $2}')
                for p in $paths; do
                  new_p=$(echo "$p" | sed 's|/var/jb||g')
                  llvm-install-name-tool -change "$p" "$new_p" "$bin" 2>/dev/null || true
                done
              done < macho.txt; rm macho.txt

              dpkg-deb -b temp_rootful "processed_debs/${PKG_NAME}_${PKG_VER}_rootful_iphoneos-arm.deb" > /dev/null
              rm -rf temp_rootful

              # ==========================================
              # B. TẠO BẢN ROOTLESS (iphoneos-arm64)
              # ==========================================
              dpkg-deb -R "$deb" temp_rootless
              # Chỉ sửa Arch, giữ nguyên ID
              python3 -c "
with open('temp_rootless/DEBIAN/control', 'r') as f: lines = f.readlines()
with open('temp_rootless/DEBIAN/control', 'w') as f:
    for line in lines:
        if line.startswith('Architecture:'): f.write('Architecture: iphoneos-arm64\n')
        else: f.write(line)
"
              # Đảm bảo đường dẫn Rootless chuẩn
              find temp_rootless -type f -name "*.plist" -exec sed -i 's|/Library/|/var/jb/Library/|g' {} +
              
              dpkg-deb -b temp_rootless "processed_debs/${PKG_NAME}_${PKG_VER}_rootless_iphoneos-arm64.deb" > /dev/null
              rm -rf temp_rootless

              # ==========================================
              # C. TẠO BẢN ROOTHIDE (iphoneos-arm64e)
              # ==========================================
              dpkg-deb -R "$deb" temp_roothide
              python3 patch.py roothide temp_roothide/DEBIAN/control
              
              # Giữ nguyên đường dẫn /var/jb/ cho RootHide
              find temp_roothide -type f -name "*.plist" -exec sed -i 's|/Library/|/var/jb/Library/|g' {} +
              
              find temp_roothide -type f -exec file {} \; | grep "Mach-O" | cut -d: -f1 > macho.txt
              while read -r bin; do
                chmod +x "$bin"
                paths=$(llvm-objdump -p "$bin" 2>/dev/null | grep -E "path|name" | grep -v "/System" | grep -v "/usr/lib/libSystem" | awk '{print $2}')
                for p in $paths; do
                  [[ "$p" == /Library/* || "$p" == /usr/lib/* ]] && llvm-install-name-tool -change "$p" "/var/jb$p" "$bin" 2>/dev/null || true
                done
              done < macho.txt; rm macho.txt

              dpkg-deb -b temp_roothide "processed_debs/${PKG_NAME}_${PKG_VER}_roothide_iphoneos-arm64e.deb" > /dev/null
              rm -rf temp_roothide
              
              echo "=== Đã xử lý xong 3 bản cho: $PKG_NAME ==="
            fi
          done
          
          # XÓA SẠCH THƯ MỤC CŨ VÀ CHỈ ĐƯA 3 FILE CHUẨN VÀO
          rm -rf debs
          mkdir -p debs
          mv processed_debs/*.deb debs/ 2>/dev/null || true
          rm -rf processed_debs patch.py

      - name: Generate Packages
        run: |
          dpkg-scanpackages -m ./debs /dev/null > Packages
          echo "=== KIỂM TRA FILE PACKAGES ==="
          grep "^Package:\|^Architecture:" Packages
          bzip2 -kf Packages
          
      - name: Generate Release
        run: |
          cat > Release <<'EOF'
          Origin: TaoJB
          Label: TaoJB
          Suite: stable
          Version: 1.0
          Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Kho tweak ca nhan cua TaoJB (Clean Repo)
          EOF
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Packages Packages.bz2 Release debs/
          git commit -m "Deep Clean & Auto-Split 3 Environments" || exit 0
          git push
