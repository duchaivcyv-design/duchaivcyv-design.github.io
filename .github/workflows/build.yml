name: Build Sileo Repo (All In One)

on:
  push:
    paths:
      - 'debs/**.deb'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2
        
      - name: Generate Packages
        run: |
          dpkg-scanpackages -m ./debs /dev/null > Packages
          bzip2 -kf Packages
          
      - name: Generate Release
        run: |
          cat > Release <<'EOF'
          Origin: TaoJB
          Label: TaoJB
          Suite: stable
          Version: 1.0
          Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Kho tweak ca nhan cua TaoJB (Rootless & RootHide)
          EOF
          
      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Packages Packages.bz2 Release
          git commit -m "Auto-update repo" || exit 0
          git push
