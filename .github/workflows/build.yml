name: Build Sileo Repo (Safe Auto-Split)

on:
  push:
    paths:
      - 'debs/**.deb'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Cần thiết để pull rebase hoạt động tốt
      
      - name: Install Dependencies (dpkg)
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 fakeroot python3

      - name: Clean and Rebuild Environments Safely
        run: |
          mkdir -p processed_debs
          
          cat << 'PYEOF' > patch.py
          import sys

          def patch_control(path, target_arch, is_roothide=False):
              with open(path, 'r') as f:
                  lines = f.readlines()
              with open(path, 'w') as f:
                  for line in lines:
                      if line.startswith('Architecture:'):
                          f.write(f'Architecture: {target_arch}\n')
                      elif line.startswith('Package:'):
                          pkg_id = line.replace('Package:', '').strip()
                          pkg_id = pkg_id.replace('.roothide', '').replace('.rootless', '').replace('.rootful', '')
                          f.write(f'Package: {pkg_id}\n')
                      elif line.startswith('Depends:') and is_roothide:
                          f.write(line.replace('mobilesubstrate', 'roothide'))
                      else:
                          f.write(line)

          if __name__ == '__main__':
              mode = sys.argv[1]
              control_path = sys.argv[2]
              if mode == 'rootful':
                  patch_control(control_path, 'iphoneos-arm')
              elif mode == 'rootless':
                  patch_control(control_path, 'iphoneos-arm64')
              elif mode == 'roothide':
                  patch_control(control_path, 'iphoneos-arm64e', True)
          PYEOF

          echo "=== 1. QUÉT VÀ XỬ LÝ FILE GỐC ==="
          for deb in debs/*.deb; do
            if [ -f "$deb" ]; then
              # Bỏ qua file do bot tạo ra để tránh lặp vô hạn
              if [[ "$deb" == *"_rootful_"* ]] || [[ "$deb" == *"_roothide_"* ]] || [[ "$deb" == *"_rootless_"* ]]; then
                continue
              fi
              
              echo "--> Đang xử lý file gốc: $deb"
              PKG_NAME=$(dpkg-deb -f "$deb" Package)
              PKG_VER=$(dpkg-deb -f "$deb" Version)
              
              # A. BẢN ROOTFUL (iphoneos-arm)
              dpkg-deb -R "$deb" temp_rootful
              python3 patch.py rootful temp_rootful/DEBIAN/control
              find temp_rootful -type f -name "*.plist" -exec sed -i 's|/var/jb/|/|g' {} +
              dpkg-deb -b temp_rootful "processed_debs/${PKG_NAME}_${PKG_VER}_rootful_iphoneos-arm.deb" > /dev/null
              rm -rf temp_rootful

              # B. BẢN ROOTLESS (iphoneos-arm64)
              dpkg-deb -R "$deb" temp_rootless
              python3 patch.py rootless temp_rootless/DEBIAN/control
              find temp_rootless -type f -name "*.plist" -exec sed -i 's|/Library/|/var/jb/Library/|g' {} +
              dpkg-deb -b temp_rootless "processed_debs/${PKG_NAME}_${PKG_VER}_rootless_iphoneos-arm64.deb" > /dev/null
              rm -rf temp_rootless

              # C. BẢN ROOTHIDE (iphoneos-arm64e) - KHÔNG patch binary để bảo vệ ElleKit
              dpkg-deb -R "$deb" temp_roothide
              python3 patch.py roothide temp_roothide/DEBIAN/control
              find temp_roothide -type f -name "*.plist" -exec sed -i 's|/Library/|/var/jb/Library/|g' {} +
              dpkg-deb -b temp_roothide "processed_debs/${PKG_NAME}_${PKG_VER}_roothide_iphoneos-arm64e.deb" > /dev/null
              rm -rf temp_roothide
              
              echo "=== Đã xử lý xong 3 bản an toàn cho: $PKG_NAME ==="
            fi
          done
          
          # Xóa file gốc (vì đã được chuyển thành bản _rootless_)
          rm -f debs/*.deb
          mv processed_debs/*.deb debs/ 2>/dev/null || true
          rm -rf processed_debs patch.py

      - name: Generate Packages
        run: |
          dpkg-scanpackages -m ./debs /dev/null > Packages
          grep "^Package:\|^Architecture:" Packages || echo "Không có gói nào!"
          bzip2 -kf Packages || true
          
      - name: Generate Release
        run: |
          cat > Release <<'EOF'
          Origin: TaoJB
          Label: TaoJB
          Suite: stable
          Version: 1.0
          Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Kho tweak ca nhan cua TaoJB (Safe Repo)
          EOF
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Packages Packages.bz2 Release debs/
          # [skip ci] giúp bot không tự kích hoạt lại chính nó
          git commit -m "Safe build without binary patching [skip ci]" || exit 0
          
          # ĐỒNG BỘ VỚI REMOTE TRƯỚC KHI PUSH ĐỂ TRÁNH LỖI REJECTED
          git pull origin main --rebase
          git push origin main
